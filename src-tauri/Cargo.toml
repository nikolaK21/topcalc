[package]
name = "topcalc"
version = "0.1.0"
description = "Instant offline launcher, calculator, and grapher"
authors = ["TopCalc contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "topcalc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
open = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
